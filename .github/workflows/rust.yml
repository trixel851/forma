name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Validate build and install scripts
      run: python -m py_compile scripts/build.py scripts/installer_common.py scripts/install.py scripts/uninstall.py
    - name: Build for detected operating system
      run: python scripts/build.py
    - name: Test
      run: cargo test --features gui
